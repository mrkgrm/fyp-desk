name: Sales report

on:
  schedule:
    # Philippine time is UTC+8. GitHub often starts these late or skips one,
    # so each slot is checked every 15 minutes for the following three hours.
    - cron: '*/15 16-18 * * *' # 00:00–02:45 Manila
    - cron: '*/15 0-2 * * *' # 08:00–10:45 Manila
    - cron: '*/15 8-10 * * *' # 16:00–18:45 Manila
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close the shift and send the sales report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ONLYFANS_API_KEY: ${{ secrets.ONLYFANS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          REPORT_ONLY: '1'
        run: |
          node --import tsx scripts/supabase-sync.mjs auto
          node --import tsx scripts/supabase-sync.mjs auto
