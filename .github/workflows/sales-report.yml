name: Sales report

on:
  schedule:
    # Philippine time is UTC+8. GitHub drops whole hours of scheduled runs,
    # so this checks all day. A slot that is already sent exits immediately.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Close the shift and send the sales report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ONLYFANS_API_KEY: ${{ secrets.ONLYFANS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          REPORT_ONLY: '1'
        run: |
          node --import tsx scripts/supabase-sync.mjs auto
          node --import tsx scripts/supabase-sync.mjs auto
